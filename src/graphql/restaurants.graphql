query SearchRestaurants($page: Int = 1, $limit: Int = 12, $input: SearchRestaurantsInput) {
  searchRestaurants(page: $page, limit: $limit, input: $input) {
    items {
      id
      name
      description
      address
      city
      zipCode
      phone
      cuisineType
      imageUrl
      coverImageUrl
      rating
      deliveryFee
      estimatedDeliveryTime
      latitude
      longitude
      type
      isFeatured
      sortOrder
      isActive
      createdAt
      updatedAt
    }
    pageInfo {
      totalItems
      totalPages
      currentPage
      hasNextPage
      hasPreviousPage
    }
  }
}

query Restaurant($id: ID!) {
  restaurant(id: $id) {
    id
    name
    description
    address
    city
    zipCode
    phone
    cuisineType
    imageUrl
    coverImageUrl
    rating
    deliveryFee
    estimatedDeliveryTime
    latitude
    longitude
    type
    isFeatured
    sortOrder
    isActive
    createdAt
    updatedAt
  }
}

query SearchMenuItems($page: Int = 1, $limit: Int = 50, $input: SearchMenuItemsInput) {
  searchMenuItems(page: $page, limit: $limit, input: $input) {
    items {
      id
      name
      description
      price
      category
      imageUrl
      isAvailable
      seller
      badge
      isFeatured
      sortOrder
      kind
      marketCategoryId
      marketCategory {
        id
        label
        subtitle
        imageUrl
        icon
        iconLib
        tint
        iconColor
      }
      restaurantId
      supplements {
        id
        name
        price
        isAvailable
        sortOrder
      }
      createdAt
      updatedAt
    }
    pageInfo {
      totalItems
      totalPages
    }
  }
}

query MenuItemsByRestaurant($restaurantId: ID!, $page: Int = 1, $limit: Int = 50) {
